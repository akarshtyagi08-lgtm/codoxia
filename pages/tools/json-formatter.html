<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter & Validator — Codoxia</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <style>
    .tool-layout {
      padding: 40px 0 80px;
    }
    .tool-header {
      margin-bottom: 32px;
    }
    .tool-workspace {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }
    @media (max-width: 850px) {
      .tool-workspace {
        grid-template-columns: 1fr;
      }
    }
    .json-panel {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-md);
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .panel-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .panel-title {
      font-size: 1.1rem;
      font-weight: 700;
    }
    .json-textarea {
      width: 100%;
      height: 380px;
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 16px;
      color: var(--text-main);
      font-family: var(--font-mono);
      font-size: 0.9rem;
      outline: none;
      resize: vertical;
      line-height: 1.5;
    }
    .btn-group {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }
    .status-tag {
      font-family: var(--font-mono);
      font-size: 0.8rem;
      padding: 4px 10px;
      border-radius: 4px;
      display: inline-block;
    }
    .status-valid { color: var(--accent-emerald); background: rgba(16, 185, 129, 0.1); }
    .status-error { color: var(--accent-rose); background: rgba(244, 63, 94, 0.1); }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="container header-container">
      <a href="../../index.html" class="brand-logo">
        <img src="../../assets/images/logo.png" alt="Codoxia Logo" class="logo-img">
      </a>
      <nav class="nav-links">
        <a href="../../index.html" class="nav-link">Home</a>
        <a href="../challenges/index.html" class="nav-link">Challenges</a>
        <a href="index.html" class="nav-link active">Tools</a>
        <a href="../profile/index.html" class="nav-link">Profile</a>
      </nav>
      <div class="auth-buttons">
        <a href="../auth/login.html" class="btn btn-secondary btn-interactive">Sign In</a>
        <a href="../auth/signup.html" class="btn btn-primary btn-interactive">Get Started</a>
      </div>
    </div>
  </header>

  <!-- Tool Content -->
  <main class="container tool-layout">
    <div class="tool-header">
      <h1 class="hero-title" style="font-size: 2.2rem; text-align: left; margin-bottom: 8px;">JSON Formatter & Validator</h1>
      <p style="color: var(--text-muted);">Paste raw JSON to format, validate syntax, or minify instantly in client memory.</p>
    </div>

    <div class="tool-workspace">
      <!-- Input Panel -->
      <div class="json-panel hover-lift">
        <div class="panel-toolbar">
          <span class="panel-title">Raw JSON Input</span>
          <span id="validationTag" class="status-tag status-valid">READY</span>
        </div>
        <textarea id="jsonInput" class="json-textarea input-glow" placeholder='{"project":"Codoxia","version":1.0,"features":["algorithms","tools"]}'></textarea>
        <div class="btn-group">
          <button id="btnPrettify" class="btn btn-primary btn-interactive" style="padding: 8px 16px; font-size: 0.85rem;">Format JSON</button>
          <button id="btnMinify" class="btn btn-secondary btn-interactive" style="padding: 8px 16px; font-size: 0.85rem;">Minify</button>
        </div>
      </div>

      <!-- Output Panel -->
      <div class="json-panel hover-lift">
        <div class="panel-toolbar">
          <span class="panel-title">Formatted Output</span>
          <button id="btnCopy" class="btn btn-secondary btn-interactive" style="padding: 4px 10px; font-size: 0.8rem;">Copy Output</button>
        </div>
        <textarea id="jsonOutput" class="json-textarea" readonly placeholder="Formatted output will appear here..."></textarea>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>© 2026 Codoxia. All rights reserved.</p>
      <p class="footer-credit">Developed & Maintained by <strong>Akarsh</strong> (<a href="mailto:akarshtyagi08@gmail.com">akarshtyagi08@gmail.com</a>)</p>
    </div>
  </footer>

  <script src="../../js/animations.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
