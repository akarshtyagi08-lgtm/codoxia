<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Codoxia</title>
  <link rel="stylesheet" href="../../css/main.css">
  <link rel="stylesheet" href="../../css/animations.css">
  <style>
    .auth-wrapper {
      min-height: calc(100vh - 140px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }
    .auth-card {
      background: var(--bg-card);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-lg);
      padding: 40px;
      width: 100%;
      max-width: 440px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .auth-header {
      margin-bottom: 28px;
      text-align: center;
    }
    .auth-title {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .auth-subtitle {
      color: var(--text-muted);
      font-size: 0.9rem;
    }
    .form-group {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-label {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }
    .form-input {
      background: var(--bg-primary);
      border: 1px solid var(--border-subtle);
      border-radius: var(--radius-sm);
      padding: 12px 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      width: 100%;
    }
    .form-options {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      margin-bottom: 24px;
    }
    .remember-me {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--text-muted);
      cursor: pointer;
    }
    .forgot-link {
      color: var(--text-accent);
      text-decoration: none;
    }
    .forgot-link:hover {
      text-decoration: underline;
    }
    .auth-submit-btn {
      width: 100%;
      padding: 12px;
      font-size: 0.95rem;
    }
    .auth-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 0.85rem;
      color: var(--text-muted);
    }
    .auth-footer a {
      color: var(--text-accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <header class="site-header">
    <div class="container header-container">
      <a href="../../index.html" class="brand-logo">
        <img src="../../assets/images/logo.png" alt="Codoxia Logo" class="logo-img">
      </a>
      <nav class="nav-links">
        <a href="../../index.html" class="nav-link">Home</a>
        <a href="../challenges/index.html" class="nav-link">Challenges</a>
        <a href="../tools/index.html" class="nav-link">Tools</a>
        <a href="../profile/index.html" class="nav-link">Profile</a>
      </nav>
      <div class="auth-buttons">
        <a href="login.html" class="btn btn-secondary btn-interactive active">Sign In</a>
        <a href="signup.html" class="btn btn-primary btn-interactive">Get Started</a>
      </div>
    </div>
  </header>

  <!-- Login Main Content -->
  <main class="auth-wrapper">
    <div class="auth-card hover-lift animate-fade-in">
      <div class="auth-header">
        <h1 class="auth-title">Welcome Back</h1>
        <p class="auth-subtitle">Enter your credentials to access your developer workbench</p>
      </div>

      <form id="loginForm" onsubmit="event.preventDefault();">
        <div class="form-group">
          <label class="form-label" for="loginEmail">Email Address</label>
          <input type="email" id="loginEmail" class="form-input input-glow" placeholder="dev@codoxia.io" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="loginPassword">Password</label>
          <input type="password" id="loginPassword" class="form-input input-glow" placeholder="••••••••••••" required>
        </div>

        <div class="form-options">
          <label class="remember-me">
            <input type="checkbox" style="accent-color: var(--text-accent);"> Remember me
          </label>
          <a href="#" class="forgot-link">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-interactive auth-submit-btn">Sign In to Dashboard</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="signup.html">Create one now</a>
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container footer-container">
      <p>© 2026 Codoxia. All rights reserved.</p>
      <p class="footer-credit">Developed & Maintained by <strong>Akarsh</strong> (<a href="mailto:akarshtyagi08@gmail.com">akarshtyagi08@gmail.com</a>)</p>
    </div>
  </footer>

  <script src="../../js/animations.js"></script>
  <script src="../../js/app.js"></script>
</body>
</html>
